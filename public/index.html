<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godot MCP Dashboard</title>
    <link rel="stylesheet" href="/styles/output.css">
    <script defer src="/node_modules/alpinejs/dist/cdn.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .log-entry {
            transition: background-color 0.2s;
        }
        .log-entry:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen" x-data="dashboard()" x-init="init()">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-4xl font-bold text-gray-900 mb-2">Godot MCP Dashboard</h1>
                    <p class="text-gray-600">Monitor your Godot MCP server and bridge connection</p>
                </div>
                <button 
                    @click="refreshStatus()"
                    class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition shadow-md">
                    <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Refresh
                </button>
            </div>
        </header>

        <!-- Status Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Server Status -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-semibold text-gray-900">Server</h2>
                    <span 
                        class="px-3 py-1 rounded-full text-sm font-medium"
                        :class="status.bridgeConnected ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
                        x-text="status.bridgeConnected ? 'Connected' : 'Disconnected'">
                    </span>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between">
                        <span class="text-gray-600">Uptime:</span>
                        <span class="font-medium" x-text="formatUptime(status.uptime)"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Active Sessions:</span>
                        <span class="font-medium" x-text="status.activeSessions"></span>
                    </div>
                </div>
            </div>

            <!-- Bridge Status -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-semibold text-gray-900">Bridge</h2>
                    <span 
                        class="px-3 py-1 rounded-full text-sm font-medium"
                        :class="getBridgeStatusColor(bridgeHealth.status)"
                        x-text="bridgeHealth.status">
                    </span>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between">
                        <span class="text-gray-600">Port:</span>
                        <span class="font-medium" x-text="bridgeHealth.port"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Version:</span>
                        <span class="font-medium" x-text="bridgeHealth.version || 'unknown'"></span>
                    </div>
                </div>
            </div>

            <!-- Activity -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-900 mb-4">Activity</h2>
                <div class="space-y-2">
                    <div class="flex justify-between">
                        <span class="text-gray-600">Log Entries:</span>
                        <span class="font-medium" x-text="logs.length"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Last Update:</span>
                        <span class="font-medium" x-text="formatTime(lastUpdate)"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Log Viewer -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-semibold text-gray-900">Server Logs</h2>
                    <span 
                        class="px-2 py-1 rounded-full text-xs font-medium"
                        :class="getConnectionStatusColor()"
                        x-text="connectionStatus">
                    </span>
                </div>
                <div class="flex gap-2">
                    <label class="flex items-center gap-2 px-4 py-2 bg-gray-200 text-gray-700 rounded cursor-pointer hover:bg-gray-300 transition">
                        <input type="checkbox" x-model="showHealthChecks" class="rounded">
                        <span>Show health checks</span>
                    </label>
                    <button 
                        @click="exportLogs()"
                        class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition"
                        :disabled="logs.length === 0">
                        Export
                    </button>
                    <button 
                        @click="clearLogs()"
                        class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition">
                        Clear
                    </button>
                    <button 
                        @click="toggleAutoScroll()"
                        class="px-4 py-2 rounded transition"
                        :class="autoScroll ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-700'">
                        Auto-scroll
                    </button>
                </div>
            </div>

            <!-- Log Entries -->
            <div 
                x-ref="logContainer"
                class="bg-gray-50 rounded border border-gray-200 p-4 font-mono text-sm max-h-96 overflow-y-auto">
                <template x-if="filteredLogs().length === 0">
                    <p class="text-gray-500 italic">No logs yet...</p>
                </template>
                <template x-for="log in filteredLogs()" :key="log.id">
                    <div class="log-entry py-1 px-2 rounded hover:bg-gray-100">
                        <div class="flex items-start">
                            <span class="text-gray-500 flex-shrink-0" x-text="formatLogTime(log.timestamp)"></span>
                            <span 
                                class="font-semibold ml-2 flex-shrink-0"
                                :class="getLogLevelColor(log.level)"
                                x-text="log.level.toUpperCase()">
                            </span>
                            <span class="ml-2 flex-grow" x-text="log.message"></span>
                        </div>
                        <template x-if="log.context && Object.keys(log.context).length > 0">
                            <div class="ml-20 mt-1 text-xs text-gray-600">
                                <template x-for="(value, key) in log.context" :key="key">
                                    <span class="inline-block mr-4">
                                        <span class="font-semibold" x-text="key + ':'"></span>
                                        <span x-text="value"></span>
                                    </span>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script>
        function dashboard() {
            return {
                status: {
                    uptime: 0,
                    bridgeConnected: false,
                    activeSessions: 0,
                    lastActivity: new Date()
                },
                bridgeHealth: {
                    status: 'unknown',
                    port: 7777,
                    version: 'unknown'
                },
                logs: [],
                lastUpdate: new Date(),
                autoScroll: true,
                showHealthChecks: false,
                eventSource: null,
                logIdCounter: 0,
                connectionStatus: 'connecting',
                reconnectAttempts: 0,
                maxReconnectAttempts: 10,

                async init() {
                    await this.fetchStatus();
                    await this.fetchBridgeHealth();
                    this.connectToLogStream();
                    
                    // Poll status every 10 seconds (reduced frequency)
                    setInterval(() => this.fetchStatus(), 10000);
                    setInterval(() => this.fetchBridgeHealth(), 15000);
                },

                filteredLogs() {
                    if (this.showHealthChecks) {
                        return this.logs;
                    }
                    // Filter out health check and status requests
                    return this.logs.filter(log => {
                        if (!log.context || !log.context.path) return true;
                        const path = log.context.path;
                        return !path.includes('/api/status') && 
                               !path.includes('/api/health') && 
                               !path.includes('/api/bridge/health');
                    });
                },

                async fetchStatus() {
                    try {
                        const response = await fetch('/api/status');
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }
                        this.status = await response.json();
                        this.lastUpdate = new Date();
                    } catch (error) {
                        console.error('Failed to fetch status:', error);
                        this.status.bridgeConnected = false;
                    }
                },

                async fetchBridgeHealth() {
                    try {
                        const response = await fetch('/api/bridge/health');
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }
                        this.bridgeHealth = await response.json();
                    } catch (error) {
                        console.error('Failed to fetch bridge health:', error);
                        this.bridgeHealth.status = 'unknown';
                    }
                },

                connectToLogStream() {
                    if (this.eventSource) {
                        this.eventSource.close();
                    }

                    this.connectionStatus = 'connecting';
                    this.eventSource = new EventSource('/api/logs/stream');
                    
                    this.eventSource.onopen = () => {
                        this.connectionStatus = 'connected';
                        this.reconnectAttempts = 0;
                        console.log('SSE connection established');
                    };

                    this.eventSource.onmessage = (event) => {
                        const log = JSON.parse(event.data);
                        log.id = ++this.logIdCounter;
                        this.logs.push(log);
                        
                        // Limit logs to last 100 entries
                        if (this.logs.length > 100) {
                            this.logs.shift();
                        }
                        
                        if (this.autoScroll) {
                            this.$nextTick(() => {
                                const container = this.$refs.logContainer;
                                if (container) {
                                    container.scrollTop = container.scrollHeight;
                                }
                            });
                        }
                    };

                    this.eventSource.onerror = (error) => {
                        console.error('SSE connection error:', error);
                        this.connectionStatus = 'error';
                        
                        // Attempt to reconnect
                        if (this.reconnectAttempts < this.maxReconnectAttempts) {
                            this.reconnectAttempts++;
                            const delay = Math.min(1000 * Math.pow(2, this.reconnectAttempts), 30000);
                            console.log(`Reconnecting in ${delay}ms (attempt ${this.reconnectAttempts})`);
                            setTimeout(() => this.connectToLogStream(), delay);
                        }
                    };
                },

                clearLogs() {
                    this.logs = [];
                    this.logIdCounter = 0;
                },

                toggleAutoScroll() {
                    this.autoScroll = !this.autoScroll;
                },

                exportLogs() {
                    const logText = this.logs.map(log => 
                        `[${log.timestamp}] ${log.level.toUpperCase()}: ${log.message}`
                    ).join('\n');
                    
                    const blob = new Blob([logText], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `godot-mcp-logs-${new Date().toISOString()}.txt`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                },

                async refreshStatus() {
                    await Promise.all([
                        this.fetchStatus(),
                        this.fetchBridgeHealth()
                    ]);
                },

                formatUptime(seconds) {
                    const hours = Math.floor(seconds / 3600);
                    const minutes = Math.floor((seconds % 3600) / 60);
                    const secs = seconds % 60;
                    return `${hours}h ${minutes}m ${secs}s`;
                },

                formatTime(date) {
                    return new Date(date).toLocaleTimeString();
                },

                formatLogTime(timestamp) {
                    return new Date(timestamp).toLocaleTimeString();
                },

                getLogLevelColor(level) {
                    const colors = {
                        debug: 'text-gray-600',
                        info: 'text-blue-600',
                        warn: 'text-yellow-600',
                        error: 'text-red-600'
                    };
                    return colors[level.toLowerCase()] || 'text-gray-600';
                },

                getBridgeStatusColor(status) {
                    const colors = {
                        healthy: 'bg-green-100 text-green-800',
                        unhealthy: 'bg-red-100 text-red-800',
                        degraded: 'bg-yellow-100 text-yellow-800',
                        unknown: 'bg-gray-100 text-gray-800'
                    };
                    return colors[status] || 'bg-gray-100 text-gray-800';
                },

                getConnectionStatusColor() {
                    const colors = {
                        connected: 'bg-green-100 text-green-800',
                        connecting: 'bg-yellow-100 text-yellow-800',
                        error: 'bg-red-100 text-red-800'
                    };
                    return colors[this.connectionStatus] || 'bg-gray-100 text-gray-800';
                }
            };
        }
    </script>
</body>
</html>
